name: Verify and deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: sl_ai_admin
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sl_ai_admin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BETTER_AUTH_SECRET: local-ci-only-signing-secret-for-test-accounts
      BETTER_AUTH_URL: http://localhost:3000
      CORS_ORIGIN: http://localhost:3001
      DATABASE_URL: postgresql://postgres:test@localhost:5432/sl_ai_admin
      NEXT_PUBLIC_SERVER_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm -F @sl-ai-admin/db db:migrate:deploy
      - run: pnpm -F web exec next typegen
      - run: pnpm -F web... -F server... -F @sl-ai-admin/infra check-types
      - run: pnpm -F @sl-ai-admin/infra cdk synth --strict --quiet
      - run: pnpm test
      - run: pnpm -F web exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  deploy:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: codebuild-${{ vars.AWS_RUNNER_PROJECT }}-${{ github.run_id }}-${{ github.run_attempt }}
    timeout-minutes: 60
    environment: production
    concurrency:
      group: production
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      CF_WEB_ORIGIN: ${{ vars.CF_WEB_ORIGIN }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_DEFAULT_REGION: ${{ vars.AWS_REGION }}
      DATABASE_HOST: ${{ vars.DATABASE_HOST }}
      DATABASE_RESOURCE_ID: ${{ vars.DATABASE_RESOURCE_ID }}
      DATABASE_ADMIN_USER: ${{ vars.DATABASE_ADMIN_USER || 'postgres' }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate the database client
        run: DATABASE_URL=postgresql://build@localhost/build pnpm db:generate
      - name: Check the CodeBuild AWS identity and database settings
        env:
          EXPECTED_ACCOUNT: ${{ vars.AWS_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          : "${EXPECTED_ACCOUNT:?Set AWS_ACCOUNT_ID}"
          : "${AWS_REGION:?Set AWS_REGION}"
          : "${DATABASE_HOST:?Set DATABASE_HOST}"
          : "${DATABASE_RESOURCE_ID:?Set DATABASE_RESOURCE_ID}"
          test "$(aws sts get-caller-identity --query Account --output text --no-cli-pager)" = "$EXPECTED_ACCOUNT"
      - name: Deploy AWS backend and migrate Aurora
        id: aws
        run: |
          set -euo pipefail
          pnpm -F @sl-ai-admin/infra cdk deploy SlAiAdminBackend \
            --parameters "WebOrigin=$CF_WEB_ORIGIN" \
            --parameters "DatabaseHost=$DATABASE_HOST" \
            --parameters "DatabaseResourceId=$DATABASE_RESOURCE_ID" \
            --parameters "DatabaseAdminUser=$DATABASE_ADMIN_USER" \
            --require-approval never --outputs-file "$RUNNER_TEMP/aws-outputs.json"
          api_origin="$(jq -er '.SlAiAdminBackend.ApiOrigin' "$RUNNER_TEMP/aws-outputs.json")"
          curl --fail --silent --show-error --retry 5 "$api_origin/"
          printf 'api_origin=%s\n' "$api_origin" >> "$GITHUB_OUTPUT"
      - name: Check the public frontend and its AWS proxy
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-all-errors "$CF_WEB_ORIGIN/login" --output /dev/null
          curl --fail --silent --show-error --retry 5 --retry-all-errors "$CF_WEB_ORIGIN/trpc/healthCheck" \
            | jq -e '.result.data == "OK"'
          printf 'Frontend %s\n' "$CF_WEB_ORIGIN" >> "$GITHUB_STEP_SUMMARY"
